name: Release

on:
  push:
    tags:
      - 'v*'

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PROD_RECORDER_BC_SHADED }}
          aws-region: us-east-1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '21'
          server-id: gatlingcorp-staging
          server-username: CODEARTIFACT_USERNAME
          server-password: CODEARTIFACT_AUTH_TOKEN
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Prepare environment
        env:
          SONATYPE_PGP_SECRET: ${{ secrets.SONATYPE_PGP_SECRET }}
        run: |
          echo -n "$SONATYPE_PGP_SECRET" | base64 --decode | gpg --batch --import

      - name: Deploy
        env:
          AWS_CODEARTIFACT_DOMAIN: ${{ vars.AWS_CODEARTIFACT_DOMAIN }}
          AWS_CODEARTIFACT_OWNER: ${{ vars.AWS_CODEARTIFACT_OWNER }}
          CODEARTIFACT_USERNAME: aws
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SONATYPE_PGP_PASSPHRASE }}
          STAGING_REPOSITORY: ${{ vars.MAVEN_STAGING_REPOSITORY }}
        run: |
          CODEARTIFACT_AUTH_TOKEN="$(aws codeartifact get-authorization-token --domain "$AWS_CODEARTIFACT_DOMAIN" --domain-owner "$AWS_CODEARTIFACT_OWNER" --query authorizationToken --output text)"
          echo "::add-mask::$CODEARTIFACT_AUTH_TOKEN"
          export CODEARTIFACT_AUTH_TOKEN
          mvn --batch-mode deploy -Dgpg.passphrase="${MAVEN_GPG_PASSPHRASE}" -PRelease -DaltReleaseDeploymentRepository="${STAGING_REPOSITORY}"
